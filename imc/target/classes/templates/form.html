
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Novo IMC</title></head>
<body>
<h1>Cadastro de Pessoa</h1>
<form action="/salvar" method="post" th:object="${pessoa}">
    Nome: <input type="text" th:field="*{nome}"><br>
    Peso: <input type="text" th:field="*{peso}"><br>
    Altura: <input type="text" th:field="*{altura}"><br>
    <button type="submit">Salvar</button>
</form>
</body>
</html>
