version: '3.8'

services:
  backend:
    build:
      context: ./simulador_emprestimo_back
    container_name: simulador-backend
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/simulador
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 123456
    ports:
      - "8080:8080"
    networks:
      - app-net
      - db-net

  frontend:
    build:
      context: ./simulador_emprestimo_front
    container_name: simulador-frontend
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "3000:3000"
    networks:
      - app-net

  db:
    image: postgres:15
    container_name: simulador-db
    environment:
      POSTGRES_DB: simulador
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    volumes:
      - pgdata:/var/lib/postgresql/data
    # ports:
    #   - "5432:5432"
    networks:
      - db-net

volumes:
  pgdata:

networks:
  app-net:
  db-net:
